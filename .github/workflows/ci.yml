name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit source and history
        run: python3 tools/audit_public.py --history
      - name: Offline checks
        run: ./tools/check_fast.sh
      - name: Prepare pinned dependencies and official assets
        run: ./tools/bootstrap.sh
      - name: Build and audit universal release input without credentials
        run: |
          ./tools/build.sh --assemble
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          python3 tools/ci_release.py prepare --tag "v$VERSION"

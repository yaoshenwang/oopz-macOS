name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit source and history
        run: python3 tools/audit_public.py --history
      - name: Offline checks
        run: ./tools/check_fast.sh
      - name: Prepare pinned dependencies and original assets
        run: ./tools/bootstrap.sh
      - name: Compile without account or signing identity
        run: ./tools/build.sh --compile
